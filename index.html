#16130F;color:#16130F\">Gemini →<\u002Fa>\n      <a href=\"https://copilot.microsoft.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.08em;text-transform:uppercase;padding:12px 20px;border:2px solid #16130F;color:#16130F\">Copilot →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Section · Ateliers\" data-screen-label=\"31\" data-speaker-notes=\"11 h 15. Court retour sur la matinée, puis on cadre l'après-midi.\" style=\"height:100%;box-sizing:border-box;padding:80px 96px;background:#1B0F2E;color:#F2EDE3;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <div class=\"pp\" style=\"position:absolute;left:-140px;bottom:-160px;width:560px;height:560px;background:#7A28CB;transform:rotate(20deg)\"><\u002Fdiv>\n  <p class=\"r1\" style=\"position:relative;margin:0 0 18px;font-family:'JetBrains Mono',monospace;font-size:27px;letter-spacing:0.2em;text-transform:uppercase;color:#D9FF3D\">Partie 3 · 11 h 15<\u002Fp>\n  <h2 class=\"r2\" style=\"position:relative;margin:0;font-size:140px;font-weight:700;line-height:0.88;letter-spacing:-0.04em;max-width:15ch\">De l'exploration à la production.<\u002Fh2>\n<\u002Fsection>\n\n<section data-label=\"Les 3 consignes\" data-screen-label=\"32\" data-speaker-notes=\"Trois choses avant le dîner : le défi, la règle, le partage.\" style=\"height:100%;box-sizing:border-box;padding:70px 96px;background:#F2EDE3;color:#16130F;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <p class=\"r1\" style=\"margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.18em;text-transform:uppercase;color:#7A28CB\">Avant le dîner<\u002Fp>\n  <h2 class=\"r1\" style=\"margin:0 0 46px;font-size:88px;font-weight:700;line-height:0.9;letter-spacing:-0.03em\">Trois choses à retenir.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px\">\n    <div class=\"r2\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:12px 12px 0 #7A28CB;padding:30px 32px\">\n      <p style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;color:#7A28CB;line-height:1\">01<\u002Fp>\n      <p style=\"margin:0 0 12px;font-size:38px;font-weight:700;line-height:1.1\">Le défi<\u002Fp>\n      <p style=\"margin:0;font-size:28px;line-height:1.4;color:#3B322A\">Un artefact concret : plan de leçon, grille, texte différencié, visuel, Gem. Testé, validé, utilisable cette semaine.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r3\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:12px 12px 0 #FF5A36;padding:30px 32px\">\n      <p style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;color:#FF5A36;line-height:1\">02<\u002Fp>\n      <p style=\"margin:0 0 12px;font-size:38px;font-weight:700;line-height:1.1\">La règle<\u002Fp>\n      <p style=\"margin:0;font-size:28px;line-height:1.4;color:#3B322A\">Une seule piste parmi les trois. On va au bout. Mieux vaut un artefact fini qu'un survol de trois pistes.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r4\" style=\"background:#1B0F2E;color:#F2EDE3;border:3px solid #16130F;box-shadow:12px 12px 0 #D9FF3D;padding:30px 32px\">\n      <p style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;color:#D9FF3D;line-height:1\">03<\u002Fp>\n      <p style=\"margin:0 0 12px;font-size:38px;font-weight:700;line-height:1.1\">Le partage<\u002Fp>\n      <p style=\"margin:0;font-size:28px;line-height:1.4;color:#D5C9EA\">Trente dernières minutes, groupes mixtes-matières. Trois minutes chacun. Repartir avec une idée piochée ailleurs.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"r5\" style=\"margin-top:36px;background:#D9FF3D;border:3px solid #16130F;padding:24px 30px\">\n    <p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Les cinq repères tiennent encore.<\u002Fstrong> Le prof reste responsable. Les données restent à l'école. Rien n'est signé de votre nom sans avoir été relu.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Placement\" data-screen-label=\"33\" data-speaker-notes=\"13 h 00 : chacun rejoint son sous-groupe. Lire les trois pistes, choisir.\" style=\"height:100%;box-sizing:border-box;padding:70px 96px;background:#F2EDE3;color:#16130F;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <p class=\"r1\" style=\"margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.18em;text-transform:uppercase;color:#7A28CB\">13 h 00 — 15 h 30<\u002Fp>\n  <h2 class=\"r1\" style=\"margin:0 0 40px;font-size:88px;font-weight:700;line-height:0.9;letter-spacing:-0.03em\">Quatre sous-groupes.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\">\n    <div class=\"r2\" style=\"border-top:10px solid #4285F4;padding:22px 0 0\"><p style=\"margin:0 0 10px;font-size:34px;font-weight:700;line-height:1.1\">Français &amp; langues<\u002Fp><p style=\"margin:0;font-size:25px;line-height:1.35;color:#3B322A\">Corpus d'exercices · personnage littéraire · grille &amp; rétroaction<\u002Fp><\u002Fdiv>\n    <div class=\"r3\" style=\"border-top:10px solid #E86C4A;padding:22px 0 0\"><p style=\"margin:0 0 10px;font-size:34px;font-weight:700;line-height:1.1\">Maths &amp; sciences<\u002Fp><p style=\"margin:0;font-size:25px;line-height:1.35;color:#3B322A\">Banque de problèmes · Gem tuteur · analyse d'erreurs<\u002Fp><\u002Fdiv>\n    <div class=\"r4\" style=\"border-top:10px solid #7A5FC7;padding:22px 0 0\"><p style=\"margin:0 0 10px;font-size:34px;font-weight:700;line-height:1.1\">Univers social &amp; éthique<\u002Fp><p style=\"margin:0;font-size:25px;line-height:1.35;color:#3B322A\">Dossier de sources · débat contradictoire · ligne du temps<\u002Fp><\u002Fdiv>\n    <div class=\"r5\" style=\"border-top:10px solid #00C4CC;padding:22px 0 0\"><p style=\"margin:0 0 10px;font-size:34px;font-weight:700;line-height:1.1\">Arts · éduc. phys. · techno<\u002Fp><p style=\"margin:0;font-size:25px;line-height:1.35;color:#3B322A\">Moodboard · plans d'entraînement · progression technique<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:52px\">\n    <div class=\"r3\" style=\"background:#FFFFFF;border:3px solid #16130F;padding:24px 28px\"><p style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:26px;color:#7A28CB\">13 h 00<\u002Fp><p style=\"margin:0;font-size:28px;line-height:1.35\">Placement · lecture des 3 pistes · choix<\u002Fp><\u002Fdiv>\n    <div class=\"r4\" style=\"background:#FFFFFF;border:3px solid #16130F;padding:24px 28px\"><p style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:26px;color:#7A28CB\">13 h 15<\u002Fp><p style=\"margin:0;font-size:28px;line-height:1.35\">Travail seul ou à deux sur la piste choisie<\u002Fp><\u002Fdiv>\n    <div class=\"r5\" style=\"background:#FFFFFF;border:3px solid #16130F;padding:24px 28px\"><p style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:26px;color:#7A28CB\">15 h 00<\u002Fp><p style=\"margin:0;font-size:28px;line-height:1.35\">Partage en groupes mixtes-matières<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Atelier · Français\" data-screen-label=\"34\" data-speaker-notes=\"Trois pistes. Les prompts complets sont dans la boîte à outils.\" style=\"height:100%;box-sizing:border-box;padding:64px 96px;background:#F2EDE3;color:#16130F;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;margin-bottom:12px\">\n    <p class=\"r1\" style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.18em;text-transform:uppercase;color:#7A28CB\">Atelier 1 sur 4<\u002Fp>\n    <span class=\"w1\" style=\"flex:1;height:6px;background:#4285F4\"><\u002Fspan>\n  <\u002Fdiv>\n  <h2 class=\"r1\" style=\"margin:0 0 40px;font-size:88px;font-weight:700;line-height:0.9;letter-spacing:-0.03em\">Français &amp; langues.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n    <div class=\"r2\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #4285F4;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste1\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#2F6BD8\">Piste I · Gemini<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Un corpus d'entraînement sur une notion précise<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Une seule notion qui coince. 15 phrases calibrées : 5 correctes, 5 avec l'erreur fréquente, 5 cas limites — correction fournie.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · 15 phrases prêtes à imprimer<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r3\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #4285F4;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste2\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#2F6BD8\">Piste II · Gems<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Un personnage littéraire à interroger<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">L'élève dialogue avec un personnage d'une œuvre étudiée. Il ne sort ni de son époque, ni de son vocabulaire, ni de sa vision.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · un Gem partageable<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r4\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #4285F4;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste3\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#2F6BD8\">Piste III · Gemini<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Une grille + une rétroaction sur une vraie copie<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Reprenez le constructeur de la Famille VI avec une tâche à corriger cette semaine. Anonymisez une copie, comparez avec ce que vous auriez écrit.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · grille 4 échelons + rétroaction<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Atelier · Maths et sciences\" data-screen-label=\"35\" data-speaker-notes=\"Rappeler : valider mathématiquement chaque solution générée.\" style=\"height:100%;box-sizing:border-box;padding:64px 96px;background:#F2EDE3;color:#16130F;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;margin-bottom:12px\">\n    <p class=\"r1\" style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.18em;text-transform:uppercase;color:#7A28CB\">Atelier 2 sur 4<\u002Fp>\n    <span class=\"w1\" style=\"flex:1;height:6px;background:#E86C4A\"><\u002Fspan>\n  <\u002Fdiv>\n  <h2 class=\"r1\" style=\"margin:0 0 40px;font-size:88px;font-weight:700;line-height:0.9;letter-spacing:-0.03em\">Maths &amp; sciences.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n    <div class=\"r2\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #E86C4A;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste4\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#C4522F\">Piste I · Gemini<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Une banque de problèmes différenciés<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Trois d'application directe, trois de mise en équation, trois de transfert. Solution étape par étape et erreur typique à surveiller.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · 9 problèmes validés<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r3\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #E86C4A;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste5\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#C4522F\">Piste II · Gems<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Un tuteur socratique pour votre notion<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Constructeur de la Famille V, adapté à votre notion et à vos règles-limites. Testez comme un élève rusé, puis faites tester par deux collègues.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · un Gem testé<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r4\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #E86C4A;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste6\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#C4522F\">Piste III · NotebookLM<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Une analyse d'erreurs sur un lot de copies<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">15 à 25 copies anonymisées. Ce que votre œil voit copie par copie, il vous le donne d'un coup, avec citations vers les extraits.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · 3-5 erreurs + remédiations<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Atelier · Univers social\" data-screen-label=\"36\" data-speaker-notes=\"Le débat : choisir un vrai enjeu débattu, pas un sujet consensuel.\" style=\"height:100%;box-sizing:border-box;padding:64px 96px;background:#F2EDE3;color:#16130F;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;margin-bottom:12px\">\n    <p class=\"r1\" style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.18em;text-transform:uppercase;color:#7A28CB\">Atelier 3 sur 4<\u002Fp>\n    <span class=\"w1\" style=\"flex:1;height:6px;background:#7A5FC7\"><\u002Fspan>\n  <\u002Fdiv>\n  <h2 class=\"r1\" style=\"margin:0 0 40px;font-size:88px;font-weight:700;line-height:0.9;letter-spacing:-0.03em\">Univers social &amp; éthique.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n    <div class=\"r2\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #7A5FC7;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste7\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#6247A8\">Piste I · NotebookLM<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Un dossier de sources pour un cours à venir<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Trois à cinq sources fiables déposées : mind map, audio Deep Dive, plan de cours de 60 minutes avec questions classées.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · un notebook complet<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r3\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #7A5FC7;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste8\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#6247A8\">Piste II · Gemini · Copilot<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Un débat contradictoire prêt à jouer<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Deux positions, trois arguments chacune, un contre-exemple par argument, une source vérifiable, cinq questions de synthèse sur les biais.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · un dossier « deux positions »<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r4\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #7A5FC7;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste9\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#6247A8\">Piste III · Canva · Gemini<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Une ligne du temps visuelle pour la classe<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Quatre à six moments-clés illustrés dans un style cohérent, montés sur un format horizontal. À annoter, ou à donner à trous.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · une ligne du temps imprimable<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Atelier · Arts, éduc. phys., techno\" data-screen-label=\"37\" data-speaker-notes=\"Trois disciplines, trois usages très concrets.\" style=\"height:100%;box-sizing:border-box;padding:64px 96px;background:#F2EDE3;color:#16130F;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;margin-bottom:12px\">\n    <p class=\"r1\" style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.18em;text-transform:uppercase;color:#7A28CB\">Atelier 4 sur 4<\u002Fp>\n    <span class=\"w1\" style=\"flex:1;height:6px;background:#00C4CC\"><\u002Fspan>\n  <\u002Fdiv>\n  <h2 class=\"r1\" style=\"margin:0 0 40px;font-size:88px;font-weight:700;line-height:0.9;letter-spacing:-0.03em\">Arts · éduc. phys. · techno.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n    <div class=\"r2\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #00C4CC;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste10\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#00A9B0\">Piste I · Canva · Gemini<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Un moodboard pour un projet artistique<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Six à huit images d'un même thème, en variant les angles — détail, ensemble, lumière, matière — pour ne pas biaiser vers un seul rendu.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · un moodboard à projeter<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r3\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #00C4CC;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste11\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#00A9B0\">Piste II · Gemini · Copilot<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Des plans d'entraînement différenciés<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Un cycle de 6 semaines en trois versions — débutant, standard, avancé — avec objectif, activités et indicateur observable par semaine.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · 3 plans de cycle<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"r4\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #00C4CC;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n      <image-slot id=\"piste12\" style=\"position:relative;width:100%;height:150px;border:2px solid #16130F\" shape=\"rect\" placeholder=\"Visuel\"><\u002Fimage-slot>\n      <p style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#00A9B0\">Piste III · Gemini · Copilot<\u002Fp>\n      <p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.1\">Une progression d'exercices techniques<\u002Fp>\n      <p style=\"margin:0;font-size:26px;line-height:1.4;color:#3B322A\">Cinq exercices de 15 à 30 minutes, une habileté chacun, avec critère de réussite observable (« je vois que… ») et variante avancée.<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:24px;line-height:1.35;color:#7A28CB\"><strong>Livrable<\u002Fstrong> · 5 exercices en progression<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Le partage\" data-screen-label=\"38\" data-speaker-notes=\"15 h 00. Sans ce moment, la formation s'évapore.\" style=\"height:100%;box-sizing:border-box;padding:80px 96px;background:#1B0F2E;color:#F2EDE3;font-family:'Space Grotesk',system-ui,sans-serif;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;overflow:hidden;position:relative\">\n  <div>\n    <p class=\"r1\" style=\"margin:0 0 16px;font-family:'JetBrains Mono',monospace;font-size:27px;letter-spacing:0.2em;text-transform:uppercase;color:#D9FF3D\">15 h 00 — 15 h 30<\u002Fp>\n    <h2 class=\"r1\" style=\"margin:0 0 30px;font-size:104px;font-weight:700;line-height:0.88;letter-spacing:-0.035em\">Le partage.<\u002Fh2>\n    <p class=\"r2\" style=\"margin:0;font-size:34px;line-height:1.35;color:#D5C9EA\">Sans ce moment, la formation s'évapore. Avec, chacun repart en sachant que <span style=\"color:#D9FF3D\">ce qu'il a produit fonctionne<\u002Fspan> — et qu'il n'est pas seul à explorer.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"r3\" style=\"display:flex;flex-direction:column;gap:18px;font-size:30px;line-height:1.35\">\n    <div style=\"display:flex;gap:18px\"><span style=\"font-family:'JetBrains Mono',monospace;color:#D9FF3D\">01<\u002Fspan><span>Groupes de 3-4 personnes, idéalement mixtes-matières.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:18px\"><span style=\"font-family:'JetBrains Mono',monospace;color:#D9FF3D\">02<\u002Fspan><span>Trois minutes chacun : ce que j'ai voulu faire, comment l'IA m'a aidé, ce que j'ai retouché.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:18px\"><span style=\"font-family:'JetBrains Mono',monospace;color:#D9FF3D\">03<\u002Fspan><span>Les autres commentent en une phrase : ce qui les inspire, une adaptation possible chez eux.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:18px\"><span style=\"font-family:'JetBrains Mono',monospace;color:#D9FF3D\">04<\u002Fspan><span>Chacun repart avec au moins une idée piochée dans une autre matière.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Boîte à outils\" data-screen-label=\"39\" data-speaker-notes=\"Les quatre outils autorisés. Toujours se connecter avec le compte école.\" style=\"height:100%;box-sizing:border-box;padding:70px 96px;background:#F2EDE3;color:#16130F;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <p class=\"r1\" style=\"margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.18em;text-transform:uppercase;color:#7A28CB\">À emporter<\u002Fp>\n  <h2 class=\"r1\" style=\"margin:0 0 44px;font-size:88px;font-weight:700;line-height:0.9;letter-spacing:-0.03em\">Quatre outils, un compte école.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:22px\">\n    <a class=\"r2\" href=\"https://gemini.google.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #4285F4;padding:26px 28px;display:flex;flex-direction:column;gap:12px;color:#16130F\">\n      <span style=\"width:22px;height:22px;border-radius:50%;background:#4285F4\"><\u002Fspan>\n      <span style=\"font-size:38px;font-weight:700;line-height:1\">Gemini<\u002Fspan>\n      <span style=\"font-size:25px;line-height:1.35;color:#3B322A\">Idéation, différenciation, rétroaction, image directe, Gems tuteurs.<\u002Fspan>\n      <span style=\"margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:24px;color:#7A28CB\">gemini.google.com<\u002Fspan>\n    <\u002Fa>\n    <a class=\"r3\" href=\"https://copilot.microsoft.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #7A5FC7;padding:26px 28px;display:flex;flex-direction:column;gap:12px;color:#16130F\">\n      <span style=\"width:22px;height:22px;border-radius:50%;background:#7A5FC7\"><\u002Fspan>\n      <span style=\"font-size:38px;font-weight:700;line-height:1\">Copilot<\u002Fspan>\n      <span style=\"font-size:25px;line-height:1.35;color:#3B322A\">Écosystème Microsoft — idéation, rédaction, résumés, Pages.<\u002Fspan>\n      <span style=\"margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:24px;color:#7A28CB\">copilot.microsoft.com<\u002Fspan>\n    <\u002Fa>\n    <a class=\"r4\" href=\"https://notebooklm.google.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #E86C4A;padding:26px 28px;display:flex;flex-direction:column;gap:12px;color:#16130F\">\n      <span style=\"width:22px;height:22px;border-radius:50%;background:#E86C4A\"><\u002Fspan>\n      <span style=\"font-size:38px;font-weight:700;line-height:1\">NotebookLM<\u002Fspan>\n      <span style=\"font-size:25px;line-height:1.35;color:#3B322A\">Laboratoire de sources — mind map, audio, réponses citées.<\u002Fspan>\n      <span style=\"margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:24px;color:#7A28CB\">notebooklm.google.com<\u002Fspan>\n    <\u002Fa>\n    <a class=\"r5\" href=\"https://www.canva.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"background:#FFFFFF;border:3px solid #16130F;box-shadow:10px 10px 0 #00C4CC;padding:26px 28px;display:flex;flex-direction:column;gap:12px;color:#16130F\">\n      <span style=\"width:22px;height:22px;border-radius:50%;background:#00C4CC\"><\u002Fspan>\n      <span style=\"font-size:38px;font-weight:700;line-height:1\">Canva<\u002Fspan>\n      <span style=\"font-size:25px;line-height:1.35;color:#3B322A\">Design complet — Magic Design, Magic Write, Magic Media.<\u002Fspan>\n      <span style=\"margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:24px;color:#7A28CB\">canva.com<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Aide-mémoire\" data-screen-label=\"40\" data-speaker-notes=\"La page à imprimer. Tout le reste tient là-dedans.\" style=\"height:100%;box-sizing:border-box;padding:60px 96px;background:#F2EDE3;color:#16130F;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <p class=\"r1\" style=\"margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.18em;text-transform:uppercase;color:#7A28CB\">Aide-mémoire<\u002Fp>\n  <h2 class=\"r1\" style=\"margin:0 0 36px;font-size:76px;font-weight:700;line-height:0.9;letter-spacing:-0.03em\">Toute la journée sur une page.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:44px\">\n    <div class=\"r2\">\n      <p style=\"margin:0 0 18px;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#7A28CB\">Les cinq repères<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;font-size:26px;line-height:1.35\">\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong>Le prof reste responsable.<\u002Fstrong> Rien ne part sans relecture.<\u002Fp>\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong>Les données restent à l'école.<\u002Fstrong> Dans le doute, on anonymise.<\u002Fp>\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong>On le dit aux élèves.<\u002Fstrong> La transparence enseigne l'usage.<\u002Fp>\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong>Elle écrit vite, on pense mieux.<\u002Fstrong> Le jugement reste le vôtre.<\u002Fp>\n        <p style=\"margin:0\"><strong>Le temps gagné retourne à la classe.<\u002Fstrong> C'est un moyen, pas un but.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"r3\">\n      <p style=\"margin:0 0 18px;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#7A28CB\">Les six familles<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;font-size:26px;line-height:1.35\">\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong style=\"color:#7A28CB\">I · Idéation<\u002Fstrong> — 3 pistes de SAÉ à partir d'un objectif. Gemini, Copilot.<\u002Fp>\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong style=\"color:#7A28CB\">II · Différenciation<\u002Fstrong> — 3 versions d'un texte : noyau, standard, enrichie.<\u002Fp>\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong style=\"color:#7A28CB\">III · Visuel<\u002Fstrong> — affiche complète dans Canva, image directe dans Gemini.<\u002Fp>\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong style=\"color:#7A28CB\">IV · Sources<\u002Fstrong> — 3 à 10 sources indexées, mind map, audio, citations.<\u002Fp>\n        <p style=\"margin:0;padding-bottom:12px;border-bottom:2px solid #D8CEBC\"><strong style=\"color:#7A28CB\">V · Interactif<\u002Fstrong> — un Gem tuteur qui refuse de donner la réponse.<\u002Fp>\n        <p style=\"margin:0\"><strong style=\"color:#7A28CB\">VI · Rétroaction<\u002Fstrong> — grille à 4 échelons, puis rétroaction sur copie anonymisée.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Clôture\" data-screen-label=\"41\" data-speaker-notes=\"Finir là-dessus. Laisser la question ouverte.\" style=\"height:100%;box-sizing:border-box;padding:96px 104px;background:#1B0F2E;color:#F2EDE3;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative\">\n  <div class=\"pp\" style=\"position:absolute;right:-100px;top:-100px;width:520px;height:520px;border-radius:50%;background:#7A28CB\"><\u002Fdiv>\n  <p class=\"r1\" style=\"position:relative;margin:0 0 24px;font-family:'JetBrains Mono',monospace;font-size:27px;letter-spacing:0.2em;text-transform:uppercase;color:#D9FF3D\">Une seule question à emporter<\u002Fp>\n  <h2 class=\"r2\" style=\"position:relative;margin:0 0 44px;font-size:124px;font-weight:700;line-height:0.9;letter-spacing:-0.04em;max-width:20ch\">Qu'est-ce que je fais du temps qu'elle me libère?<\u002Fh2>\n  <div class=\"w1\" style=\"position:relative;height:14px;background:#D9FF3D;width:58%\"><\u002Fdiv>\n  <div style=\"position:relative;display:flex;align-items:center;gap:36px;margin-top:40px\">\n    <image-slot id=\"logo\" style=\"position:relative;width:260px;height:110px;flex:0 0 auto\" shape=\"rect\" placeholder=\"Logo de l'école\"><\u002Fimage-slot>\n    <p class=\"r4\" style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.1em;color:#8E7BAE\">L'IA au tableau · 18 septembre 2026 · conseiller RÉCIT<br>{{ shortUrlText }}<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<\u002Fx-import>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;shortUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://bit.ly/PLM1809&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Partage&quot;}}\">\nconst TPL = {\n  f1: `Tu es un enseignant expérimenté en {matiere} au {niveau}.\nJe veux construire une situation d'apprentissage de {duree}\nsur {concept}.\nObjectif d'apprentissage : {objectif}.\nContraintes : {contraintes}.\n\nPropose-moi 3 pistes différentes de mise en situation qui\naccrocheraient de vrais élèves de cet âge. Pour chacune :\n— le déclencheur (accroche);\n— la tâche des élèves;\n— la trace évaluative;\n— le lien explicite avec le concept.\n\nSois concret. Pas de généralités du type \"un débat\" — nomme le débat.`,\n  f2: `Voici un texte que je vais donner à mes élèves de {niveau}\nen {matiere}. Je veux 3 versions différentes du même contenu :\n\n1. VERSION NOYAU — 60 % de la longueur, vocabulaire épuré, phrases courtes.\n2. VERSION STANDARD — le texte tel quel + un lexique de 5 mots difficiles\n   définis simplement à la fin.\n3. VERSION ENRICHIE — le texte tel quel + 3 questions d'approfondissement.\n\nGarde le même sens, les mêmes idées principales, le même registre.\n\nTEXTE :\n{texte}`,\n  f3: `Illustration pédagogique pour ma classe de {niveau} en {matiere},\nsur le sujet : {sujet}.\n\nStyle : {style}.\nPalette : {palette}.\nComposition : format {format}, espace pour un titre au-dessus.\nSans texte dans l'image — je l'ajouterai moi-même.`,\n  f4: `À partir de ces sources uniquement, aide-moi à préparer un cours\nde {duree} pour des élèves de {niveau} sur {sujet}.\n\n1. Résume les 3 idées principales à retenir (une phrase chacune).\n2. Propose une entrée en matière qui accroche des élèves de cet âge.\n3. Génère 5 questions de discussion classées par niveau de difficulté\n   (rappel, compréhension, transfert).\n4. Pour chaque question, cite les extraits sources qui aideraient\n   à y répondre.`,\n  f5: `Tu es un tuteur pour élèves de {niveau} qui apprennent {notion}.\n\nRÈGLES ABSOLUES :\n— Tu ne donnes JAMAIS la réponse directement.\n— Tu poses des questions pour amener l'élève à trouver par lui-même.\n— Si l'élève bloque après 2 essais, tu donnes UN indice, pas la réponse.\n— Vocabulaire de {niveau}, phrases courtes, exemples du quotidien.\n— Tu termines chaque échange par une petite question de vérification.\n— Si l'élève te demande de faire son devoir à sa place, tu réponds :\n  \"Ça, ce sera avec ton prof en classe.\"\n\nSUJETS COUVERTS : {sujets}.\n\nTON : patient, respectueux, sans infantilisation.`,\n  f6: `Je vais évaluer une {tache} de {niveau} sur le sujet : {sujet}.\nObjectif d'apprentissage : {objectif}.\n\nPropose-moi une grille descriptive à 4 échelons\n(dépasse — atteint — en voie — à travailler) avec 4 critères pertinents.\nPour chaque critère, décris ce qu'on OBSERVE à chaque échelon\nen une phrase concrète et observable (pas \"bien\" mais\n\"le texte présente une thèse claire dès le premier paragraphe\").\nFormat tableau.`\n};\n\nconst MAT = ['français','mathématiques','sciences','univers social','éthique et culture religieuse','anglais','arts plastiques','éducation physique','technologie / informatique'];\nconst NIV = ['secondaire 1','secondaire 2','secondaire 3','secondaire 4','secondaire 5'];\nconst OPTS = {\n  f1_matiere: { placeholder: 'Matière…', list: MAT },\n  f1_niveau: { placeholder: 'Niveau…', list: NIV },\n  f1_duree: { placeholder: 'Durée…', list: ['1 période','2 périodes','3 périodes','4 périodes','une SAÉ complète (2 semaines)'] },\n  f2_matiere: { placeholder: 'Matière…', list: MAT },\n  f2_niveau: { placeholder: 'Niveau…', list: NIV },\n  f3_matiere: { placeholder: 'Matière…', list: MAT },\n  f3_niveau: { placeholder: 'Niveau…', list: NIV },\n  f3_style: { placeholder: 'Style…', list: ['aquarelle épurée','illustration vectorielle plate','photo réaliste','croquis à main levée','style manuel scolaire européen','infographie moderne','gravure ancienne'] },\n  f3_format: { placeholder: 'Format…', list: ['vertical (affiche)','carré (diaporama)','horizontal (bannière)'] },\n  f4_niveau: { placeholder: 'Niveau…', list: NIV },\n  f4_duree: { placeholder: 'Durée du cours…', list: ['30 minutes','45 minutes','60 minutes','75 minutes','90 minutes'] },\n  f5_niveau: { placeholder: 'Niveau…', list: NIV },\n  f6_tache: { placeholder: 'Tâche évaluée…', list: ['rédaction','compréhension de lecture','rapport de laboratoire','présentation orale','débat','production artistique','projet de recherche','résolution de situation-problème','portfolio'] },\n  f6_niveau: { placeholder: 'Niveau…', list: NIV }\n};\n\nclass Component extends DCLogic {\n  state = { forms: {}, timers: {}, copied: {}, open: null };\n\n  componentDidMount() {\n    this._iv = setInterval(() => {\n      const t = this.state.timers;\n      let live = false;\n      const next = {};\n      Object.keys(t).forEach(k => {\n        const v = t[k];\n        if (v.running && v.left > 0) { next[k] = { running: v.left - 1 > 0, left: v.left - 1 }; live = true; }\n        else next[k] = v;\n      });\n      if (live) this.setState({ timers: next });\n    }, 1000);\n  }\n  componentWillUnmount() { clearInterval(this._iv); clearInterval(this._qrIv); }\n\n  qrDataUrl(url) {\n    const blank = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';\n    if (typeof window.qrcode !== 'function') return blank;\n    try {\n      const q = window.qrcode(0, 'M');\n      q.addData(url);\n      q.make();\n      return q.createDataURL(10, 12);\n    } catch (e) { return blank; }\n  }\n\n  fill(id) {\n    const v = this.state.forms[id] || {};\n    return (TPL[id] || '').replace(/\\{(\\w+)\\}/g, (m, k) => (v[k] && String(v[k]).trim()) ? v[k] : '[' + k + ']');\n  }\n\n  legacyCopy(text) {\n    const ta = document.createElement('textarea');\n    ta.value = text;\n    ta.setAttribute('readonly', '');\n    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';\n    document.body.appendChild(ta);\n    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);\n    let ok = false;\n    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }\n    document.body.removeChild(ta);\n    return ok;\n  }\n\n  copy(text, key) {\n    const done = () => {\n      if (!key) return;\n      this.setState(s => ({ copied: Object.assign({}, s.copied, { [key]: true }) }));\n      setTimeout(() => this.setState(s => ({ copied: Object.assign({}, s.copied, { [key]: false }) })), 1600);\n    };\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(done, () => { this.legacyCopy(text); done(); });\n    } else {\n      this.legacyCopy(text);\n      done();\n    }\n  }\n\n  timer(id, secs) {\n    const t = this.state.timers[id] || { left: secs, running: false };\n    const mm = Math.floor(t.left / 60), ss = t.left % 60;\n    return {\n      time: mm + ':' + (ss < 10 ? '0' + ss : ss),\n      label: t.left === 0 ? 'Fini' : (t.running ? 'Pause' : 'Démarrer'),\n      start: () => this.setState(s => {\n        const c = s.timers[id] || { left: secs, running: false };\n        const left = c.left === 0 ? secs : c.left;\n        return { timers: Object.assign({}, s.timers, { [id]: { left, running: !c.running && left > 0 } }) };\n      }),\n      reset: () => this.setState(s => ({ timers: Object.assign({}, s.timers, { [id]: { left: secs, running: false } }) }))\n    };\n  }\n\n  renderVals() {\n    const url = this.props.shortUrl || 'https://bit.ly/PLM1809';\n    const qr = this.qrDataUrl(url);\n    if (typeof window.qrcode !== 'function' && !this._qrIv) {\n      this._qrIv = setInterval(() => {\n        if (typeof window.qrcode === 'function') { clearInterval(this._qrIv); this._qrIv = null; this.forceUpdate(); }\n      }, 300);\n    }\n    const v = {\n      qrSrc: qr,\n      shortUrlText: url.replace(/^https?:\\/\\//, '').replace(/\\/$/, ''),\n      onField: (e) => {\n        const el = e.target, id = el.dataset.form, k = el.dataset.key, val = el.value;\n        this.setState(s => ({ forms: Object.assign({}, s.forms, { [id]: Object.assign({}, s.forms[id], { [k]: val }) }) }));\n      },\n      toggleMenu: (e) => {\n        const b = e.currentTarget, id = b.dataset.form + '_' + b.dataset.key;\n        this.setState(s => ({ open: s.open === id ? null : id }));\n      },\n      pickOpt: (e) => {\n        const b = e.currentTarget, form = b.dataset.form, k = b.dataset.key, val = b.dataset.val;\n        this.setState(s => ({\n          open: null,\n          forms: Object.assign({}, s.forms, { [form]: Object.assign({}, s.forms[form], { [k]: val }) })\n        }));\n      },\n      copyPrompt: (e) => {\n        const btn = e.currentTarget;\n        const box = btn.closest('[data-prompt]');\n        const pre = box && box.querySelector('pre');\n        if (!pre) return;\n        this.copy(pre.textContent.trim(), null);\n        if (btn.dataset.busy) return;\n        const orig = btn.textContent;\n        btn.dataset.busy = '1';\n        btn.textContent = 'Copié ✓';\n        setTimeout(() => { btn.textContent = orig; delete btn.dataset.busy; }, 1600);\n      }\n    };\n    Object.keys(OPTS).forEach(id => {\n      const form = id.split('_')[0], k = id.split('_')[1];\n      const cur = (this.state.forms[form] || {})[k];\n      v[id + 'Label'] = cur || OPTS[id].placeholder;\n      v[id + 'Open'] = this.state.open === id;\n      v[id + 'Opts'] = OPTS[id].list;\n    });\n    ['f1','f2','f3','f4','f5','f6'].forEach((id, i) => {\n      const n = i + 1;\n      const t = this.timer('t' + n, 420);\n      v['t' + n + 'Time'] = t.time;\n      v['t' + n + 'Label'] = t.label;\n      v['t' + n + 'Start'] = t.start;\n      v['t' + n + 'Reset'] = t.reset;\n      const out = this.fill(id);\n      v[id + 'Out'] = out;\n      v[id + 'Copy'] = () => this.copy(out, id);\n      v[id + 'CopyLabel'] = this.state.copied[id] ? 'Copié ✓' : 'Copier le prompt';\n    });\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
